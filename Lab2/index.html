<!DOCTYPE html>
<html>
<head>
    <style>
        .fontsave-1 {
            font-family: Arial;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }
 
        .fontget-2 {
            font-family: Arial;
            font-size: 16px;
            margin-bottom: 20px;
        }
 
        .fontline-3 {
            font-family: Arial;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 20px;
        }
 
        .adobe-font {
            font-family: Verdana;
            font-size: 15px;
            font-weight: normal;
        }
 
        .adobe-logo {
            width: 24px;
            height: auto;
            vertical-align: middle;
            margin-right: 8px;
        }
 
        .watch-button {
            background-color: black;
            color: white;
            border: none;
            height: 30px;
            width: 68px;
            border-radius: 25px;
            cursor: pointer;
        }
 
        .watch-button:hover {
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);
        }
 
        .watch-button:active {
            transform: scale(0.95);
        }
 
        .learnmore-button {
            background-color: white;
            border-color: black;
            border-style: solid;
            border-width: 1px;
            color: black;
            border: 1px solid black;
            height: 30px;
            width: 92px;
            border-radius: 25px;
            cursor: pointer;
            margin-left: 8px;
            margin-bottom: 80px;
        }
 
        .learnmore-button:hover {
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);
            cursor: pointer;
        }
 
        .learnmore-button:active {
            transform: scale(0.95);
        }
 
        .apple-logo {
            display: block;
            width: 80px;
            height: auto;
            margin: 80px auto 40px auto;
        }
 
        .shop-description {
            background-color: rgb(227, 65, 64);
            color: white;
            font-family: Arial;
            font-size: 12px;
            text-align: center;
            padding-top: 18px;
            padding-bottom: 18px;
            margin-bottonm: 50px;
        }
 
        .shop-link {
            color: white;
            margin-left: 5px;
            cursor: pointer;
        }
 
        .shop-link:hover {
            text-decoration: underline;
            cursor: pointer;
        }
 
    </style>
 
</head>
 
    <p class="fontsave-1">
        Save 40% on Creative Cloud Pro for the first 3 months.
    </p>
 
    <p class="fontget-2">
        Get the plan that includes Photoshop, Acrobat Pro, and more.
    </p>
 
    <p class="fontspons-3">
        <img src="adobe.png" class="adobe-logo">
        <strong>Sponsored</strong> &middot; <span class="adobe-font">adobe.com</span>
    </p>
 
    <button class="watch-button">Watch</button>

    <button class="learnmore-button">Learn more</button>

    <div><img src="apple.png" class="apple-logo"></div>
 
    <p class="shop-description">
        Shop early for the best selection of holiday favorites.
        <a href="https://www.adobe.com/" target="_blank" class="shop-link">
            <span>Shop now &gt;</span>
        </a>
    </p>
 
</html>
