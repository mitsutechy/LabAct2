<!DOCTYPE html>
<html>
<head>
    <style>
 
        .font-title {
            font-family: Arial;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }
 
        .font-description {
            font-family: Arial;
            font-size: 16px;
            margin-bottom: 20px;
        }
 
        .secondline-font {
            font-family: Arial;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
 
        .adobe-font {
            font-family: Verdana;
            font-size: 20px;
            font-weight: normal;
        }
 
        .adobe-logo {
            width: 24px;
            height: auto;
            vertical-align: middle;
            margin-right: 8px;
        }
 
        .watch-button {
            background-color: black;
            color: white;
            border: none;
            height: 30px;
            width: 68px;
            border-radius: 25px;
            cursor: pointer;
        }
 
        .watch-button:hover {
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);
        }
 
        .watch-button:active {
            transform: scale(0.95);
        }
 
        .learnmore-button {
            background-color: white;
            color: black;
            border: 1px solid black;
            height: 30px;
            width: 92px;
            border-radius: 25px;
            cursor: pointer;
            margin-left: 8px;
        }
 
        .learnmore-button:hover {
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.25);
        }
 
        .learnmore-button:active {
            transform: scale(0.95);
        }
 
        .apple-logo {
            display: block;
            width: 80px;
            height: auto;
            margin: 80px auto 40px auto;
        }
 
        .banner {
            background-color: red;
            color: white;
            font-family: Arial;
            font-size: 14px;
            text-align: center;
            padding-top: 18px;
            padding-bottom: 18px;
            margin-top: 40px;
        }
 
        .shop-link {
            color: white;
            margin-left: 5px;
        }
 
        .shop-link:hover {
            text-decoration: underline;
        }
 
    </style>
 
</head>
 

 
    <h1 class="font-title">
        Save 40% on Creative Cloud Pro for the first 3 months.
    </h1>
 
    <p class="font-description">
        Get the plan that includes Photoshop, Acrobat Pro, and more.
    </p>
 
    <p class="secondline-font">
        <img src="adobe.png" class="adobe-logo">
        Sponsored &middot; <span class="adobe-font">adobe.com</span>
    </p>
 
    <button class="watch-button">Watch</button>
    <button class="learnmore-button">Learn more</button>
 
    <div><img src="apple.png" class="apple-logo"></div>
 
    <p class="banner">
        Shop early for the best selection of holiday favorites.
        <a href="https://www.adobe.com/" target="_blank" class="shop-link">
            Shop now &gt;
        </a>
    </p>
 
</html>
